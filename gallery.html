<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JNEC Events Hub — Gallery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="top">
  <h1 class="hero-title">JNEC Events Hub</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="register.html">Register</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
<div class="container py-4">

  <h2 class="mb-3">Event Gallery</h2>
  <div class="row g-3">
    <div class="col-md-4">
      <img src="media/hackathon.jpg" class="img-fluid rounded" alt="Students at last year's hackathon">
    </div>
    <div class="col-md-4">
      <img src="media/losar.jpg" class="img-fluid rounded" alt="Losar celebration">
    </div>
    <div class="col-md-4">
      <img src="media/football.jpeg" class="img-fluid rounded" alt="Inter-college football final">
    </div>
  </div>

  <h2 class="mt-5 mb-3"><i class="fa-solid fa-video"></i> Highlights Video</h2>
  <video controls class="w-100" style="max-width:480px;" poster="media/hackathon.jpg">
    <source src="media/video.mp4" type="video/mp4">
    Sorry, your browser does not support the video element.
  </video>

  <h2 class="mt-5 mb-3"><i class="fa-solid fa-music"></i> Campus Radio Jingle</h2>
  <audio controls>
    <source src="media/jingle.mp3" type="audio/mpeg">
    Sorry, your browser does not support the audio element.
  </audio>

</div>
</main>

<footer>
  <p>&copy; 2026 JNEC Events Hub</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
